# Reviewed recovery worktree unit gate passed on Python 3.11; main remains unrepaired.
# Gameplay harness is blocked by provider availability; hosted CI has not run.
# Do not enable unattended FORGE task/plan/run until all required gates pass.
repo_slug: sammyjdev/aerus-game-master-platform
default_branch: main
gate_cmd: "DATABASE_PATH=:memory: OPENROUTER_API_KEY=test-key PYTHON_DOTENV_DISABLED=1 FERNET_KEY=\"$(backend/.venv/bin/python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')\" JWT_SECRET=\"$(backend/.venv/bin/python -c 'import secrets; print(secrets.token_hex(32))')\" make check && backend/.venv/bin/python scripts/validate_migration_ledger.py && git diff --check"
setup_cmd: "uv venv --python 3.11 backend/.venv && uv pip install --python backend/.venv/bin/python -r backend/requirements.txt && (cd frontend && npm ci)"
# Disposable test keys are generated above, never loaded from backend/.env.
# The full make check prerequisites remain required without exclusions or waivers.
labels:
  ready: agent:ready
  blocked: agent:blocked
posture: product
risk_areas:
  - auth_and_secrets: [auth, authentication, authorization, jwt, fernet, credential, api key, token, .env, byok]
  - sqlite_migrations: [sqlite, migration, schema_migrations, schema change, backfill, data preservation, database]
  - campaign_state_and_ws: [campaign, isolation, state, queue, history, memory, websocket, broadcast, ws_contracts]
  - canonical_lore: [lore, world.md, bestiary, campaign.yaml, sync-lore]
  - provider_routing: [billing, provider, routing, openrouter, ollama, hosted narrator, fallback, local_llm]
quality_rubric:
  testability: true
  # Single-instance SQLite/WAL is intentional; do not require unsolicited scaling.
  scalability: false
  progression: true
cross_review: false
