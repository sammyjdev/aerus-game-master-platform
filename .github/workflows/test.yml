name: Tests

on:
  push:
  pull_request:
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_PATH: ":memory:"
      OPENROUTER_API_KEY: "test-key"
      PYTHON_DOTENV_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (required by ChromaDB)
        run: sudo apt-get install -y build-essential

      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Generate disposable test keys
        run: |
          python - <<'PY'
          import os
          import secrets
          from cryptography.fernet import Fernet

          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"FERNET_KEY={Fernet.generate_key().decode()}\n")
              env.write(f"JWT_SECRET={secrets.token_hex(32)}\n")
          PY

      - name: Run backend tests
        run: make PYTHON="$(command -v python)" test

      - name: Compile backend sources
        run: make PYTHON="$(command -v python)" backend-compile

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        run: make frontend-test

      - name: Lint frontend
        run: make frontend-lint

      - name: Build frontend
        run: make frontend-build
